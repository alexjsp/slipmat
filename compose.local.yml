# Local container testing only.
#
# Docker Desktop on macOS has no real host networking, so SSDP discovery will
# not work here — set DOMOVOI_SEED_IP to a known speaker address, and expect
# UPnP events to be unreliable. For day-to-day development run natively with
# `just dev` instead.
services:
  domovoi:
    build:
      context: .
      dockerfile: Dockerfile
    image: domovoi:local
    ports:
      - '5544:5544'
    volumes:
      - ./data:/data
    environment:
      DOMOVOI_DATA_DIR: /data
      DOMOVOI_LOG_LEVEL: debug
      DOMOVOI_SEED_IP: ${DOMOVOI_SEED_IP:-}
      DOMOVOI_HOMEKIT: '0'
    restart: unless-stopped
