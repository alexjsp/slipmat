# Production / Unraid. Deployed by `just deploy-unraid`.
#
# network_mode: host is REQUIRED, not a convenience:
#   - SSDP discovery is multicast and does not cross a bridge network
#   - Sonos speakers dial back into our UPnP event callback URL
#   - HomeKit (when enabled) advertises over mDNS
services:
  slipmat:
    build:
      context: .
      dockerfile: Dockerfile
    image: slipmat:local
    container_name: slipmat
    network_mode: host
    volumes:
      - /mnt/user/appdata/slipmat:/data
    environment:
      SLIPMAT_PORT: ${SLIPMAT_PORT:-5544}
      SLIPMAT_DATA_DIR: /data
      SLIPMAT_LOG_LEVEL: ${SLIPMAT_LOG_LEVEL:-info}
      # Auth is optional: set SLIPMAT_PASSWORD in .env to require a login.
      # Left blank there is no login, which is a reasonable default on a trusted
      # LAN — Sonos has no auth of its own either.
      SLIPMAT_PASSWORD: ${SLIPMAT_PASSWORD:-}
      SLIPMAT_SESSION_SECRET: ${SLIPMAT_SESSION_SECRET:-}
      # Fallback if SSDP discovery is blocked; a single speaker IP is enough.
      SLIPMAT_SEED_IP: ${SLIPMAT_SEED_IP:-}
      SLIPMAT_HOMEKIT: ${SLIPMAT_HOMEKIT:-0}
      SLIPMAT_HOMEKIT_PIN: ${SLIPMAT_HOMEKIT_PIN:-031-45-154}
    restart: unless-stopped
