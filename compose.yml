# Running Slipmat with Docker Compose. `docker compose up -d` next to a `.env`
# holding any of the settings below; every one is optional.
#
# network_mode: host is REQUIRED, not a convenience:
#   - SSDP discovery is multicast and does not cross a bridge network
#   - Sonos speakers dial back into our UPnP event callback URL
#   - HomeKit (when enabled) advertises over mDNS
services:
  slipmat:
    image: ghcr.io/alexjsp/slipmat:latest
    container_name: slipmat
    network_mode: host
    volumes:
      - ./data:/data
    # Every setting the server reads has to be listed here. Compose reads .env
    # for interpolation but injects nothing on its own, so a variable set in
    # .env and missing below is silently ignored — the app starts happily on the
    # default and gives no hint that the setting was seen and dropped.
    #
    # SLIPMAT_FAKE_SONOS is deliberately absent: production should not be able
    # to run against the in-memory household by way of a stray .env line.
    environment:
      # Who the server runs as, and who /data is handed to on start. Unraid
      # convention is 99:100; the default is the image's own slipmat user.
      PUID: ${PUID:-10001}
      PGID: ${PGID:-10001}
      SLIPMAT_HOST: ${SLIPMAT_HOST:-0.0.0.0}
      SLIPMAT_PORT: ${SLIPMAT_PORT:-5544}
      SLIPMAT_DATA_DIR: /data
      SLIPMAT_LOG_LEVEL: ${SLIPMAT_LOG_LEVEL:-info}
      # Extra hostnames to accept in the Host header, comma separated. Additive:
      # bare IPs, localhost, *.local and *.ts.net are always allowed, so this is
      # only needed for a real domain pointed at the box.
      SLIPMAT_ALLOWED_HOSTS: ${SLIPMAT_ALLOWED_HOSTS:-}
      # Host and port the speakers dial back into for UPnP events. Only needed
      # when the address they should use isn't the one we'd guess.
      SLIPMAT_CALLBACK_HOST: ${SLIPMAT_CALLBACK_HOST:-}
      SLIPMAT_TZ: ${SLIPMAT_TZ:-}
      # Expansion temporarily replaces an idle speaker's queue, so it stays off
      # unless asked for.
      SLIPMAT_ALLOW_QUEUE_EXPANSION: ${SLIPMAT_ALLOW_QUEUE_EXPANSION:-0}
      SLIPMAT_UTILITY_ZONE: ${SLIPMAT_UTILITY_ZONE:-}
      # Auth is optional: set SLIPMAT_PASSWORD in .env to require a login.
      # Left blank there is no login, which is a reasonable default on a trusted
      # LAN — Sonos has no auth of its own either.
      SLIPMAT_PASSWORD: ${SLIPMAT_PASSWORD:-}
      SLIPMAT_SESSION_SECRET: ${SLIPMAT_SESSION_SECRET:-}
      # Fallback if SSDP discovery is blocked; a single speaker IP is enough.
      SLIPMAT_SEED_IP: ${SLIPMAT_SEED_IP:-}
      SLIPMAT_HOMEKIT: ${SLIPMAT_HOMEKIT:-0}
      # Unset generates a PIN on first run; it is shown in Settings.
      SLIPMAT_HOMEKIT_PIN: ${SLIPMAT_HOMEKIT_PIN:-}
      SLIPMAT_HOMEKIT_NAME: ${SLIPMAT_HOMEKIT_NAME:-Slipmat}
    restart: unless-stopped
